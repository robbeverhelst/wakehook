name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, release commit (changelog/version)
  issues: write # semantic-release comments
  pull-requests: write # semantic-release comments
  packages: write # push image to GHCR
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      # semantic-release is Node-native; run it on Node while the app stays Bun.
      # semantic-release v25 requires Node >=22.14; @semantic-release/git v11 and
      # @semantic-release/changelog v7 require ^22.22.2 || >=24.15.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      # OIDC trusted publishing needs npm >= 11.5.1 (runner ships 10.x).
      - run: npm install -g npm@latest

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No NPM_TOKEN: npm auth comes from OIDC trusted publishing (id-token: write).
      - name: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
